name: ZAYTOONA Ω Autonomous Runner
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: zaytoona-autonomous-runner
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run one resumable cycle
        run: node zaytoona/autonomy/runner.mjs
      - name: Persist runner state
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .zaytoona || true
          if git diff --cached --quiet; then echo 'NO_STATE_CHANGE'; else git commit -m 'chore(zaytoona): persist autonomous runner state'; git push; fi
      - name: Safety regression
        if: always()
        run: node --test zaytoona/autonomy/runner.test.mjs
