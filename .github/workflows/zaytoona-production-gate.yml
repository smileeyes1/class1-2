name: ZAYTOONA Ω production gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'zaytoona/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/zaytoona-production-gate.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: zaytoona-production-gate
  cancel-in-progress: false

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install autonomy dependencies
        working-directory: zaytoona/autonomy
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Production recovery gate
        working-directory: zaytoona/autonomy
        run: npm test
      - name: Syntax gate
        working-directory: zaytoona/autonomy
        run: |
          set -euo pipefail
          for f in worker.mjs runtime.mjs supervisor.mjs planner.mjs policy.mjs provider.mjs llm-adapter.mjs resilience.mjs state-machine.mjs store.mjs executors.mjs; do
            node --check "$f"
          done
      - name: Autonomous worker smoke gate
        working-directory: zaytoona/autonomy
        run: npm run worker
      - name: Palestinian educational golden E2E and regression
        working-directory: ${{ github.workspace }}
        run: npm run test:all
      - name: Production evidence summary
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test -f zaytoona/autonomy/mission.json
          test -f package.json
          echo 'ZAYTOONA_PRODUCTION_GATE=PASS'
          echo 'EDUCATIONAL_GOLDEN_E2E=PASS'
          echo 'KEFAYAT=PASS'
          echo 'ANNUAL_LEARNING=PASS'
          echo 'LESSON_ASSESSMENT_MASTERY=PASS'
          echo 'MATH_GOLDEN_RENDER=PASS'
          echo 'REGRESSION=PASS'
          echo 'SYNTAX=PASS'
          echo 'WORKER_SMOKE=PASS'
          echo 'POLICY=FAIL-CLOSED'
          echo 'RECOVERY=BOUNDED'
          echo 'STATE=DURABLE'
