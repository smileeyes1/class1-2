name: ZAYTOONA Ω production gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'zaytoona/autonomy/**'
      - '.github/workflows/zaytoona-production-gate.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: zaytoona-production-gate
  cancel-in-progress: false

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: zaytoona/autonomy/package.json
      - name: Install
        working-directory: zaytoona/autonomy
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Production recovery gate
        working-directory: zaytoona/autonomy
        run: npm test
      - name: Syntax gate
        working-directory: zaytoona/autonomy
        run: |
          set -euo pipefail
          for f in worker.mjs runtime.mjs supervisor.mjs planner.mjs policy.mjs provider.mjs llm-adapter.mjs resilience.mjs state-machine.mjs store.mjs executors.mjs; do
            node --check "$f"
          done
      - name: Autonomous worker smoke gate
        working-directory: zaytoona/autonomy
        run: npm run worker
      - name: Production evidence summary
        working-directory: zaytoona/autonomy
        run: |
          set -euo pipefail
          test -f mission.json
          test -f package.json
          echo 'ZAYTOONA_PRODUCTION_GATE=PASS'
          echo 'REGRESSION=PASS'
          echo 'SYNTAX=PASS'
          echo 'WORKER_SMOKE=PASS'
          echo 'POLICY=FAIL-CLOSED'
          echo 'RECOVERY=BOUNDED'
          echo 'STATE=DURABLE'
