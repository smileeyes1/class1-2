name: Ω State Journal Regression
on:
  push:
    branches: [main]
    paths:
      - 'zaytoona/autonomy/**'
      - '.github/workflows/state-journal-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  journal-and-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: State journal baseline regression
        run: node --test zaytoona/autonomy/state-journal.test.mjs
      - name: Crash Offline Recovery Resume adversarial regression
        run: node --test zaytoona/autonomy/state-journal.adversarial.test.mjs zaytoona/autonomy/adversarial.test.mjs
