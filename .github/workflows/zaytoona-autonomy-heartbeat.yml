name: ZAYTOONA Ω autonomous runtime

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions minimum supported scheduled interval: 5 minutes.
    - cron: '*/5 * * * *'
  push:
    paths:
      - 'zaytoona/autonomy/**'

concurrency:
  group: zaytoona-autonomy-runtime
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  autonomy-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: zaytoona/autonomy/package.json

      - name: Install dependencies deterministically where a lockfile exists
        working-directory: zaytoona/autonomy
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi

      - name: Syntax gate
        working-directory: zaytoona/autonomy
        run: |
          set -euo pipefail
          for f in worker.mjs runtime.mjs supervisor.mjs planner.mjs policy.mjs provider.mjs llm-adapter.mjs resilience.mjs state-machine.mjs store.mjs executors.mjs; do
            node --check "$f"
          done

      - name: Regression
        working-directory: zaytoona/autonomy
        run: npm test

      - name: Autonomous worker
        working-directory: zaytoona/autonomy
        run: npm run worker

      - name: Persist durable state and validated artifacts
        run: |
          set -euo pipefail
          git config user.name 'zaytoona-autonomy[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .zaytoona zaytoona/autonomy/artifacts 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No durable state changes.'
            exit 0
          fi
          git commit -m 'chore(zaytoona): persist autonomous runtime state'
          git push

      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zaytoona-runtime-diagnostics
          path: |
            .zaytoona/**
            zaytoona/autonomy/artifacts/**
          if-no-files-found: ignore
          retention-days: 14
