name: ZAYTOONA Static Delivery

# GO release pipeline: canonical Kefayat audit -> release gate -> Pages deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - '.zaytoona/**'
      - 'artifacts/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DOCX parser
        run: python -m pip install --disable-pip-version-check python-docx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate canonical audited Kefayat catalog
        run: python scripts/kefayat-master-audit.py

      - name: Deterministic release gate
        run: node scripts/zaytoona-release-gate.mjs

      - name: Syntax gates
        run: |
          set -euo pipefail
          node --check zaytoona/learning-core-v3.js
          node --check zaytoona/annual-learning-engine-v1.js
          node --check zaytoona/autonomous-assurance-v1.js
          node --check zaytoona/autonomy/executors.mjs
          node --check zaytoona/autonomy/policy.mjs

      - name: Annual learning engine regression
        run: node --test zaytoona/tests/annual-learning-engine.test.mjs

      - name: Autonomous regression suite
        working-directory: zaytoona/autonomy
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
