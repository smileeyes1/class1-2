name: ZAYTOONA Adaptive Pulse

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zaytoona-pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run autonomous pulse
        run: node zaytoona/pulse.mjs
      - name: Persist checkpoint
        run: |
          if git diff --quiet -- zaytoona/runtime-state.json; then
            echo 'No state change.'
            exit 0
          fi
          git config user.name 'zaytoona-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zaytoona/runtime-state.json
          git commit -m 'chore(zaytoona): persist adaptive pulse checkpoint'
          git push
