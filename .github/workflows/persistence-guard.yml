name: Ω Persistence Guard
on:
  push:
    branches: [main]
    paths:
      - 'zaytoona/persistence/**'
      - '.github/workflows/persistence-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Lifecycle and recovery regression
        run: node --test zaytoona/persistence/omega-persistence.test.mjs
