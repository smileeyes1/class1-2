name: Zaytoona Omega Assurance
on:
  push:
    branches: [zaytoona-omega-release, main]
  pull_request:
    branches: [main]
jobs:
  omega:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:omega
