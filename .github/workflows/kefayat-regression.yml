name: Kefayat Regression
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kefayat-regression
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require audited canonical catalog
        run: |
          set -euo pipefail
          test -s zaytoona/kefayat/catalog.json
          test -s zaytoona/kefayat/catalog.min.json
          test -s zaytoona/kefayat/master-audit.json
      - name: Catalog regression
        run: node scripts/kefayat-regression.mjs
      - name: End-to-end Kefayat pipeline
        run: node zaytoona/kefayat-production-pipeline.mjs
      - name: Full release gate
        run: npm run test:all
      - name: Release gate
        run: npm run test:release
