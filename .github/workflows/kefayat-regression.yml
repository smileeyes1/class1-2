name: Kefayat Regression
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run catalog regression
        run: node scripts/kefayat-regression.mjs
      - name: Run release gate
        run: node scripts/zaytoona-release-gate.mjs
