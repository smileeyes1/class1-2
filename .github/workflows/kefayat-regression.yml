name: Kefayat Regression
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kefayat-regression
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate real catalog
        run: node scripts/sync-kefayat.mjs
      - name: Catalog regression
        run: node scripts/kefayat-regression.mjs
      - name: End-to-end Kefayat pipeline
        run: node zaytoona/kefayat-production-pipeline.mjs
      - name: Full release gate
        run: npm run test:all
      - name: Release gate
        run: npm run test:release
      - name: Persist verified catalog
        run: |
          git config user.name 'zaytoona-autonomy[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zaytoona/kefayat/catalog.json zaytoona/kefayat/catalog.min.json zaytoona/kefayat/sync-manifest.json
          if git diff --cached --quiet; then echo 'CATALOG_UNCHANGED'; else git commit -m 'chore(zaytoona): persist verified Kefayat catalog'; git push; fi
