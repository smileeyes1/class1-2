name: ZAYTOONA Kefayat Sync
on:
  push:
    branches: [main, zaytoona-omega-v1]
    paths-ignore:
      - 'zaytoona/kefayat/catalog.json'
      - 'zaytoona/kefayat/catalog.min.json'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kefayat-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate Kefayat catalog
        run: node zaytoona/kefayat/sync.mjs zaytoona/kefayat
      - name: Commit catalog when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zaytoona/kefayat/catalog.json zaytoona/kefayat/catalog.min.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(zaytoona): sync Kefayat competency catalog'
          git push
