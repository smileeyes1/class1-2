name: ZAYTOONA Kefayat Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/sync-kefayat.mjs'
      - '.github/workflows/zaytoona-kefayat-sync.yml'

permissions:
  contents: write

concurrency:
  group: zaytoona-kefayat-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build complete Kefayat catalog
        run: node scripts/sync-kefayat.mjs
      - name: Validate catalog
        run: node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('zaytoona/kefayat/catalog.json','utf8'));if(!x.recordCount||x.recordCount!==x.records.length)process.exit(1);if(!x.records.every(r=>r.id&&r.source&&r.raw))process.exit(1);console.log('PASS',x.recordCount)"
      - name: Persist catalog
        run: |
          git config user.name 'zaytoona-autonomy[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zaytoona/kefayat/catalog.json zaytoona/kefayat/catalog.min.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(zaytoona): refresh Kefayat competency catalog'
            git push
          else
            echo 'Catalog unchanged'
          fi
