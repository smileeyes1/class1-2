name: ZAYTOONA Kefayat Sync
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-kefayat.mjs'
      - '.github/workflows/kefayat-sync.yml'
      - 'scripts/kefayat-regression.mjs'
      - 'zaytoona/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate real catalog
        run: node scripts/sync-kefayat.mjs
      - name: Hard validation and coverage
        run: node scripts/kefayat-regression.mjs
      - name: Full regression
        run: npm run test:all
      - name: Commit generated catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zaytoona/kefayat/catalog.json zaytoona/kefayat/catalog.min.json zaytoona/kefayat/sync-manifest.json
          if git diff --cached --quiet; then echo 'CATALOG_UNCHANGED'; exit 0; fi
          git commit -m 'chore(zaytoona): sync real Kefayat catalog'
          git push
  release-gate:
    needs: sync-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Release Gate
        run: npm run test:release
