name: ZAYTOONA Kefayat Sync
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-kefayat.mjs'
      - '.github/workflows/kefayat-sync.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync competency catalog
        run: node scripts/sync-kefayat.mjs
      - name: Validate catalog
        run: node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('zaytoona/kefayat/catalog.min.json','utf8')); if(!Array.isArray(x.records)||!x.records.length||x.recordCount!==x.records.length) process.exit(1); console.log('CATALOG PASS',x.recordCount)"
      - name: Commit catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zaytoona/kefayat/catalog.json zaytoona/kefayat/catalog.min.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore(zaytoona): sync competency catalog'
          git push
