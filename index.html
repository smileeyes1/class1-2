<!DOCTYPE html>

</select>

</div>

<div class="card">
<h3>الدروس</h3>

</div>

<div class="card">
<h3>المخرجات</h3>
<div id="output"></div>
</div>

</div>

<script src="curriculum-offline.json"></script>
<script src="generator.js"></script>

</html>
