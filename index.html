<script>(function(){'use strict';const ready=()=>{if(document.getElementById('omega-control'))return;const box=document.createElement('div');box.id='omega-control';box.dir='rtl';box.style='position:fixed;left:14px;bottom:14px;z-index:9999;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;padding:9px;border:1px solid #d9e5df;border-radius:14px;box-shadow:0 6px 22px rgba(0,0,0,.12);font-family:system-ui,Arial';box.innerHTML='<button id="omega-run" style="border:0;border-radius:10px;padding:10px 14px;background:#176b4f;color:#fff;font-weight:800;cursor:pointer">▶ تشغيل زيتونة Ω</button><button id="omega-resume" style="border:1px solid #d9e5df;border-radius:10px;padding:10px;background:#fff;font-weight:700;cursor:pointer">استئناف</button><span id="omega-msg" style="font-size:.9rem">جارٍ تجهيز الكفايات…</span>';document.body.appendChild(box);const msg=document.getElementById('omega-msg');window.ZaytoonaKefayatSync?.ready?.then(m=>msg.textContent=`الكفايات: ${m.status} · ${m.records||0} سجل`).catch(()=>msg.textContent='تعذر مزامنة الكفايات');document.getElementById('omega-run').onclick=async()=>{msg.textContent='جارٍ الفحص…';const r=await window.ZaytoonaOmegaCommand.start('تشغيل زيتونة Ω');msg.textContent=r.ok?'✓ GO':'⚠ يحتاج إصلاح'};document.getElementById('omega-resume').onclick=async()=>{msg.textContent='جارٍ الاستئناف…';const r=await window.ZaytoonaOmegaCommand.resume();msg.textContent=r.ok?'✓ GO':'⚠ يحتاج إصلاح'}};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ready);else ready();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=12').catch(()=>{})})();</script></body></html>
