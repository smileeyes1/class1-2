<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176b4f">
<meta name="description" content="زيتونة Ω — نظام تعلم قائم على الكفايات للصفوف ١–٤">
<title>زيتونة Ω — نظام التعلم والإتقان</title>
</head>
<body>
<script src="zaytoona/learning-core-v3.js?v=5"></script>
<script src="zaytoona/autonomous-assurance-v1.js?v=2"></script>
<script src="zaytoona/omega-state.js?v=2"></script>
<script src="zaytoona/omega-factory.js?v=2"></script>
<script src="zaytoona/omega-command.js?v=2"></script>
<script>
(()=>{const ready=()=>{if(document.getElementById('omega-control'))return;const box=document.createElement('div');box.id='omega-control';box.dir='rtl';box.style='position:fixed;left:14px;bottom:14px;z-index:9999;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;padding:9px;border:1px solid #d9e5df;border-radius:14px;box-shadow:0 6px 22px rgba(0,0,0,.12);font-family:system-ui,Arial';box.innerHTML='<button id="omega-run" style="border:0;border-radius:10px;padding:10px 14px;background:#176b4f;color:#fff;font-weight:800;cursor:pointer">▶ تشغيل زيتونة Ω</button><button id="omega-resume" style="border:1px solid #d9e5df;border-radius:10px;padding:10px 14px;background:#fff;font-weight:700;cursor:pointer">استئناف</button><span id="omega-msg" style="font-size:.9rem">جاهز</span>';document.body.appendChild(box);const msg=document.getElementById('omega-msg'),show=s=>msg.textContent=s;document.getElementById('omega-run').onclick=async()=>{show('جارٍ الفحص…');const r=await window.ZaytoonaOmegaCommand.start('تشغيل زيتونة Ω');show(r.ok?'✓ GO':'⚠ يحتاج إصلاح')};document.getElementById('omega-resume').onclick=async()=>{show('جارٍ الاستئناف…');const r=await window.ZaytoonaOmegaCommand.resume();show(r.ok?'✓ GO':'⚠ يحتاج إصلاح')}};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ready);else ready();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=8').catch(()=>{})})();
</script>
</body>
</html>
